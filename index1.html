<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的视频网站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 200px; background: #1f2937; padding: 20px 12px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  .sidebar button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #374151; color: #fff; font-size: 15px; cursor: pointer; text-align: left; transition: background .2s; }
  .sidebar button:hover { background: #4b5563; }
  .sidebar button.active { background: #2563eb; }
  .main { flex: 1; padding: 24px; overflow-y: auto; }
  .video-area { background: #fff; border-radius: 12px; padding: 20px; min-height: 400px; display: flex; flex-direction: column; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .video-area h2 { font-size: 20px; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
  .video-list { display: flex; flex-wrap: wrap; gap: 20px; flex: 1; align-content: flex-start; }
  .video-item { width: calc(50% - 10px); max-width: 320px; background: #f9fafb; border-radius: 8px; padding: 10px; }
  .video-item video { width: 100%; border-radius: 6px; background: #000; aspect-ratio: 16/9; object-fit: cover; }
  .video-item .caption { font-size: 14px; color: #333; margin-top: 8px; word-break: break-all; font-weight: bold; }
  .empty-tip { color: #999; font-size: 16px; padding: 80px 0; text-align: center; flex: 1; display: flex; align-items: center; justify-content: center; }
  .pagination { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
  .pagination button { padding: 8px 16px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; }
  .pagination button:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
  .pagination button:not(:disabled):hover { background: #f3f4f6; }
  .pagination span { font-size: 14px; color: #555; }
  .card { background: #fff; border-radius: 12px; padding: 24px; max-width: 540px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 20px; }
  .card h2 { font-size: 20px; margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; font-family: inherit; }
  .field textarea { min-height: 80px; resize: vertical; }
  .avatar-box { width: 100px; height: 100px; border-radius: 50%; border: 2px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; background: #f9fafb; color: #94a3b8; font-size: 12px; text-align: center; }
  .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-box:hover { border-color: #2563eb; }
  .btn { padding: 10px 22px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  .btn:hover { background: #1d4ed8; }
  .btn.secondary { background: #e5e7eb; color: #333; }
  .btn.secondary:hover { background: #d1d5db; }
  .file-row { margin-bottom: 14px; }
  .file-row input[type="file"] { font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <button data-page="home" class="active">视频主页</button>
    <button data-page="mine">我的</button>
    <button data-page="wallet">钱包</button>
    <button data-page="settings">设置</button>
    <button data-page="todo">待开发</button>
    <button data-page="todo">待开发</button>
    <button data-page="todo">待开发</button>
  </aside>

  <main class="main">
    <section id="page-home">
      <div class="video-area">
        <h2>全部视频</h2>
        <div id="videoList" class="video-list hidden"></div>
        <div id="videoEmpty" class="empty-tip">暂无视频</div>
        <div id="pagination" class="pagination hidden">
          <button id="prevPageBtn">上一页</button>
          <span id="pageInfo">第 1 页 / 共 1 页</span>
          <button id="nextPageBtn">下一页</button>
        </div>
      </div>
    </section>

    <section id="page-mine" class="hidden">
      <div class="card">
        <h2>我的资料</h2>
        <div class="field">
          <label>头像</label>
          <div class="avatar-box" id="avatarBox"><span id="avatarText">点击上传</span></div>
          <input type="file" id="avatarInput" accept="image/*" class="hidden">
        </div>
        <div class="field">
          <label for="nameInput">名字</label>
          <input type="text" id="nameInput" placeholder="请输入名字">
        </div>
        <div class="field">
          <label for="ageInput">年龄</label>
          <input type="number" id="ageInput" placeholder="请输入年龄" min="0" max="150">
        </div>
        <div class="field">
          <label for="noteInput">备注 / 个人资料</label>
          <textarea id="noteInput" placeholder="写点什么..."></textarea>
        </div>
        <button class="btn" id="saveProfileBtn">保存资料</button>
      </div>

      <div class="card">
        <h2>投稿视频</h2>
        <div class="file-row">
          <label>选择视频文件（建议不要太大）</label><br>
          <input type="file" id="videoFileInput" accept="video/*">
        </div>
        <div class="file-row">
          <label>视频说明（可选）</label><br>
          <input type="text" id="videoCaptionInput" placeholder="给视频起个名字" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;">
        </div>
        <button class="btn" id="uploadVideoBtn">立即投稿并发布</button>
        <p id="uploadStatus" style="margin-top:12px;font-size:14px;color:#2563eb;font-weight:bold;"></p>
      </div>
    </section>

    <section id="page-todo" class="hidden">
      <div class="card">
        <h2>功能未开发</h2>
        <p style="color:#666;line-height:1.8;">这个功能还在开发中，敬请期待。</p>
      </div>
    </section>
  </main>
</div>

<!-- 引入 Supabase 工具 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   ⚠️ 请替换下面这两行的内容（保留双引号）！！！！！
   ============================================================ */
const SUPABASE_URL = "https://zafohnnahdswuunhbdxu.supabase.co";
const SUPABASE_KEY = "sb_publishable_hnz6Led50sZi-qJYGmGVAA__EsemOtP";

// 安全初始化，即使填错也不影响页面点击
let supabaseClient = null;
try {
  if (window.supabase && SUPABASE_URL.includes('supabase.co')) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (e) {
  console.error("Supabase 初始化失败", e);
}

/* ============================================================
   一、页面切换逻辑（绝对优先执行）
   ============================================================ */
function showPage(pageId) {
  document.querySelectorAll('main > section').forEach(sec => {
    sec.classList.add('hidden');
  });
  const target = document.getElementById('page-' + pageId);
  if (target) target.classList.remove('hidden');
  
  document.querySelectorAll('.sidebar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === pageId);
  });
}

document.querySelectorAll('.sidebar button').forEach(btn => {
  btn.addEventListener('click', () => {
    const page = btn.dataset.page;
    if (page === 'home') {
      showPage('home');
      fetchVideos(); // 每次回主页刷新数据
    } else if (page === 'mine') {
      showPage('mine');
    } else {
      showPage('todo');
    }
  });
});

/* ============================================================
   二、视频展示与翻页
   ============================================================ */
let allVideos = []; 
let currentPage = 1; 
const itemsPerPage = 4; 

async function fetchVideos() {
  const emptyEl = document.getElementById('videoEmpty');
  
  // 如果数据库连不上，直接提示
  if (!supabaseClient) {
    emptyEl.textContent = "数据库连接失败，请检查 URL 和 Key";
    emptyEl.classList.remove('hidden');
    return;
  }

  emptyEl.textContent = "正在加载视频...";
  emptyEl.classList.remove('hidden');
  document.getElementById('videoList').classList.add('hidden');
  document.getElementById('pagination').classList.add('hidden');

  try {
    const { data, error } = await supabaseClient
      .from('videos')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;

    allVideos = data || [];
    currentPage = 1; 
    renderVideos();
  } catch (err) {
    console.error(err);
    emptyEl.textContent = "加载失败：" + err.message;
  }
}

function renderVideos() {
  const listEl = document.getElementById('videoList');
  const emptyEl = document.getElementById('videoEmpty');
  const paginationEl = document.getElementById('pagination');
  listEl.innerHTML = '';

  if (allVideos.length === 0) {
    emptyEl.textContent = "暂无视频";
    emptyEl.classList.remove('hidden');
    listEl.classList.add('hidden');
    paginationEl.classList.add('hidden');
    return;
  }

  emptyEl.classList.add('hidden');
  listEl.classList.remove('hidden');

  const startIndex = (currentPage - 1) * itemsPerPage;
  const endIndex = startIndex + itemsPerPage;
  const pageVideos = allVideos.slice(startIndex, endIndex);

  pageVideos.forEach(v => {
    const item = document.createElement('div');
    item.className = 'video-item';
    const video = document.createElement('video');
    video.src = v.video_url;
    video.controls = true;
    video.preload = 'metadata';
    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.textContent = v.caption || '未命名视频';
    item.appendChild(video);
    item.appendChild(cap);
    listEl.appendChild(item);
  });

  const totalPages = Math.ceil(allVideos.length / itemsPerPage);
  if (totalPages > 1) {
    paginationEl.classList.remove('hidden');
    document.getElementById('pageInfo').textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
    document.getElementById('prevPageBtn').disabled = (currentPage === 1);
    document.getElementById('nextPageBtn').disabled = (currentPage === totalPages);
  } else {
    paginationEl.classList.add('hidden');
  }
}

document.getElementById('prevPageBtn').addEventListener('click', () => {
  if (currentPage > 1) { currentPage--; renderVideos(); }
});
document.getElementById('nextPageBtn').addEventListener('click', () => {
  const totalPages = Math.ceil(allVideos.length / itemsPerPage);
  if (currentPage < totalPages) { currentPage++; renderVideos(); }
});

/* ============================================================
   三、投稿逻辑
   ============================================================ */
document.getElementById('uploadVideoBtn').addEventListener('click', async () => {
  const fileInput   = document.getElementById('videoFileInput');
  const captionInput = document.getElementById('videoCaptionInput');
  const statusEl    = document.getElementById('uploadStatus');
  const file = fileInput.files[0];

  if (!supabaseClient) {
    statusEl.textContent = '上传失败：Supabase 未连接';
    statusEl.style.color = 'red';
    return;
  }

  if (!file) {
    alert('请先选择一个视频文件');
    return;
  }

  statusEl.style.color = '#2563eb';
  statusEl.textContent = '正在上传，请稍候...';

  try {
    const fileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g, '')}`;
    
    // 1. 上传文件到存储桶
    const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('videos').upload(fileName, file);
    if (uploadError) throw uploadError;
    
    // 2. 获取链接
    const { data: urlData } = supabaseClient.storage.from('videos').getPublicUrl(fileName);
    const publicUrl = urlData.publicUrl;
    
    statusEl.textContent = '视频上传成功，正在保存记录...';
    
    // 3. 写入数据库表
    const { error: dbError } = await supabaseClient.from('videos').insert([{ caption: captionInput.value.trim(), video_url: publicUrl }]);
    if (dbError) throw dbError;

    statusEl.textContent = '发布成功！已跳转到主页。';
    fileInput.value = '';
    captionInput.value = '';
    
    // 4. 刷新并跳转
    await fetchVideos();
    showPage('home');
    
    setTimeout(() => { statusEl.textContent = ''; }, 3000);

  } catch (err) {
    console.error(err);
    statusEl.style.color = 'red';
    statusEl.textContent = '上传失败：' + err.message;
  }
});

/* ============================================================
   四、本地资料保存
   ============================================================ */
const avatarBox   = document.getElementById('avatarBox');
const avatarInput = document.getElementById('avatarInput');
const nameInput   = document.getElementById('nameInput');
const ageInput    = document.getElementById('ageInput');
const noteInput   = document.getElementById('noteInput');

avatarBox.addEventListener('click', () => avatarInput.click());
avatarInput.addEventListener('change', () => {
  const file = avatarInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 200; canvas.height = 200;
      const ctx = canvas.getContext('2d');
      const minSide = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - minSide)/2, (img.height - minSide)/2, minSide, minSide, 0, 0, 200, 200);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      
      avatarBox.innerHTML = '<img src="' + dataUrl + '" alt="头像">';
      const profile = JSON.parse(localStorage.getItem('profile') || '{}');
      profile.avatar = dataUrl;
      localStorage.setItem('profile', JSON.stringify(profile));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('saveProfileBtn').addEventListener('click', () => {
  const profile = JSON.parse(localStorage.getItem('profile') || '{}');
  profile.name = nameInput.value.trim();
  profile.age  = ageInput.value.trim();
  profile.note = noteInput.value.trim();
  localStorage.setItem('profile', JSON.stringify(profile));
  alert('资料已保存到本地');
});

function loadProfile() {
  const data = JSON.parse(localStorage.getItem('profile') || '{}');
  if (data.avatar) avatarBox.innerHTML = '<img src="' + data.avatar + '" alt="头像">';
  if (data.name) nameInput.value = data.name;
  if (data.age)  ageInput.value  = data.age;
  if (data.note) noteInput.value = data.note;
}

/* 启动 */
loadProfile();
fetchVideos();
</script>
</body>
</html>
